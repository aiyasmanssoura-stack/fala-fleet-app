<div id="gate" style="position:fixed;inset:0;z-index:9999;background:#16305C;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',system-ui,sans-serif">
  <form id="gateForm" style="background:#fff;color:#1B2433;border-radius:10px;padding:26px;width:min(340px,92vw)">
    <div style="font-weight:700;font-size:20px;color:#16305C;margin-bottom:14px">FALA Fleet Registry</div>
    <input id="gEmail" type="email" placeholder="Email" autocomplete="username" required style="width:100%;margin-bottom:10px;padding:8px;border:1px solid #DDE3EC;border-radius:6px;font:inherit">
    <input id="gPass" type="password" placeholder="Password" autocomplete="current-password" required style="width:100%;margin-bottom:10px;padding:8px;border:1px solid #DDE3EC;border-radius:6px;font:inherit">
    <button style="width:100%;padding:9px;border:0;border-radius:6px;background:#16305C;color:#fff;font-weight:600;cursor:pointer">Sign in</button>
    <div id="gMsg" style="color:#B3261E;font-size:12px;min-height:18px;margin-top:8px"></div>
  </form>
</div>
